name: Build Windows Client

on:
  push:
    branches:
      - main
    paths:
      - 'client_app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client_app/package-lock.json

      - name: Install dependencies
        run: |
          cd client_app
          npm install

      - name: Build Windows app
        run: |
          cd client_app
          npx electron-builder --win nsis --publish never

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./client_app/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            client_app/dist/*.exe
            client_app/dist/latest.yml
            client_app/dist/*.blockmap
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZN-RodeoApp-Windows
          path: client_app/dist/*.exe
