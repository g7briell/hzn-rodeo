name: Build macOS Client

on:
  push:
    branches:
      - main
    paths:
      - 'client_app/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client_app/package-lock.json

      - name: Install dependencies
        run: |
          cd client_app
          npm install

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client_app
          npx electron-builder --mac zip --x64 --arm64 --publish never

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./client_app/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create backward-compatible mac zip alias
        run: |
          cd client_app/dist
          FIRST_ZIP=$(ls HZN-RodeoApp-Setup-*.zip 2>/dev/null | head -n 1)
          if [ -n "$FIRST_ZIP" ]; then
            cp "$FIRST_ZIP" "HZN-RodeoApp-Setup-${{ steps.get_version.outputs.VERSION }}-mac.zip"
          fi

      - name: Publish macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          files: |
            client_app/dist/*.zip
            client_app/dist/latest-mac.yml
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZN-RodeoApp-macOS
          path: client_app/dist/*.zip
