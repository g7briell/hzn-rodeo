name: Build macOS Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client_app/package-lock.json

      - name: Install dependencies
        run: |
          cd client_app
          npm install

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client_app
          npx electron-builder --mac zip --x64 --arm64 --publish never

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./client_app/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload macOS release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: client_app/dist/HZN-RodeoApp-Setup-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: HZN-RodeoApp-Setup-${{ steps.get_version.outputs.VERSION }}-mac.zip
          tag: v${{ steps.get_version.outputs.VERSION }}
          overwrite: true

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZN-RodeoApp-macOS
          path: client_app/dist/HZN-RodeoApp-Setup-*.zip
